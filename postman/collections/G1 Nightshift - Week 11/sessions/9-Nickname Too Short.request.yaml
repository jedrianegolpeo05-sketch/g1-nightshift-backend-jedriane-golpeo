$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}/players"
method: POST
headers:
  X-Demo-User: "{{player}}"
  Content-Type: application/json
body:
  type: text
  content: '{ "display_name": "A" }'
scripts:
    - type: afterResponse
    code: |-
      pm.test("status is 400", function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
    order: 1000
