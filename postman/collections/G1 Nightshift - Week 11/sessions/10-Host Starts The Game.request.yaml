$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}/start"
method: POST
headers:
  X-Demo-User: "{{host}}"
scripts:
    - type: afterResponse
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
    order: 1000
