$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}"
method: PATCH
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: text
  content: '{ "status": "RUNNING" }'
scripts:
    - type: afterResponse
    code: |-
      pm.test("status is 409", function () {
        pm.response.to.have.status(409);
      });
    language: text/javascript
    order: 1000
