$kind: http-request
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
     "title": "Philippine Literature",
     "category": "Filipino",
     "difficulty_level": "easy"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("setId", pm.response.json().id || pm.response.json().set_id);
    language: text/javascript
order: 1000
